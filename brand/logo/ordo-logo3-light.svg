<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="ORDÖ Personal Organizer">
  <title>ORDÖ — Personal Organizer (Light: charcoal on cream)</title>

  <!-- Cream background -->
  <rect width="800" height="400" fill="#F5EFE0"/>

  <!-- ORDÖ wordmark — geometric sans, charcoal -->
  <text x="400" y="222"
        font-family="'Futura PT','Brandon Grotesque','Montserrat',Helvetica,Arial,sans-serif"
        font-size="148" font-weight="800"
        letter-spacing="8"
        text-anchor="middle"
        fill="#2E2A26">ORDÖ</text>

  <!-- Thin rule -->
  <line x1="192" y1="262" x2="608" y2="262"
        stroke="#2E2A26" stroke-width="1.2" opacity="0.5"/>

  <!-- Descriptor -->
  <text x="400" y="296"
        font-family="'Montserrat','Futura PT',Helvetica,Arial,sans-serif"
        font-size="21" font-weight="300"
        letter-spacing="13"
        text-anchor="middle"
        fill="#2E2A26" opacity="0.7">PERSONAL ORGANIZER</text>
</svg>
