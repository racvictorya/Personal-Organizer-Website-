<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" role="img" aria-label="Structured Living">
  <title>Structured Living — Geometric Mark + Wordmark (Direction B)</title>
  <rect width="600" height="260" fill="#F5F0E8"/>

  <!-- Geometric mark: three ordered lines of decreasing length, framed -->
  <g transform="translate(258, 36)">
    <rect x="0" y="0" width="84" height="84" rx="6" fill="none" stroke="#A89A86" stroke-width="2"/>
    <line x1="20" y1="30" x2="64" y2="30" stroke="#2E2A26" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="44" x2="52" y2="44" stroke="#5A4F45" stroke-width="4" stroke-linecap="round"/>
    <line x1="20" y1="58" x2="40" y2="58" stroke="#A89A86" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="186"
        font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="500" letter-spacing="8"
        text-anchor="middle" fill="#2E2A26">Structured Living</text>
  <text x="300" y="220"
        font-family="'Montserrat', 'Inter', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="300" letter-spacing="9"
        text-anchor="middle" fill="#A89A86">PROFESSIONAL ORGANIZING</text>
</svg>
